# Local-dev stack for ReviewArena.
#
# Only Postgres runs in a container; apps/web, apps/api, and
# services/review-gen run on the host (fast iteration, and review-gen
# calls the providers' hosted LLM APIs for the heavy lifting).
#
# PDFs are parsed via Datalab's hosted Chandra API (see
# services/review-gen/app/parsing/chandra.py) — no local parsing container.

services:
  postgres:
    image: postgres:16-alpine
    container_name: reviewarena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reviewarena
      POSTGRES_PASSWORD: reviewarena
      POSTGRES_DB: reviewarena
    ports:
      # Loopback only. "5432:5432" binds every interface, which on the UKP
      # VM means the public one — and this container's password is the
      # literal below, in a file in the repo. The prod stack deliberately
      # publishes no host port at all; a dev container next to it listening
      # on the internet gives that away for free. Host tooling (drizzle-kit,
      # the tsx scripts, db-browser) reaches it on localhost either way.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewarena -d reviewarena"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
