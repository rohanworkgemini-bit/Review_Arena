# Local dev runner. `pnpm dev` invokes this.
#
# Each process gets its own pane in the mprocs TUI — pick one with the
# arrow keys and Tab into it for full output. Stopping a process here
# leaves the others alone (unlike `concurrently -k` which killed them as
# a group). If you actually want them all dead, quit mprocs with `q`.
#
# The database is the local docker-compose Postgres — the `postgres` proc
# below brings it up and tails its logs (requires Docker / OrbStack
# running).

procs:
  postgres:
    shell: docker compose up -d postgres && docker compose logs -f postgres
  review-gen:
    # REVIEWARENA_ENV=development = run the billable endpoints in open mode.
    # The service now refuses to boot keyless in any other env (default-closed).
    shell: REVIEWARENA_ENV=development services/review-gen/.venv/bin/python -m uvicorn app.main:app --reload --port 8001 --app-dir services/review-gen --reload-dir services/review-gen/app
  api:
    shell: pnpm --filter @reviewarena/api dev
  web:
    shell: pnpm --filter @reviewarena/web dev
